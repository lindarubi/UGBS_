<!DOCTYPE html>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Estilos personalizados (opcional) -->
    <style>
        .welcome-image, .news-image {
            border-radius: 10px;
            margin-top: 20px;
        }
        .news-image {
            max-width: 50%;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
        /* Estilo para el carrusel */
        .carousel-item img {
            border-radius: 10px;
            height: 900px; /* Tamaño fijo para las imágenes */

            object-fit: cover; /* Asegura que las imágenes cubran el espacio */

        /* Estilo para resaltar el enlace activo */
        .navbar-nav .nav-link.active {
            font-weight: bold;
            color: #fff !important; /* Color blanco */
            background-color: rgba(255, 255, 255, 0.1); /* Fondo semi-transparente */
            border-radius: 5px;
        }
        /* Estilo para la imagen antes del carrusel */
        .imagen-previa {
            width: 100%;
            max-height: 300px; /* Ajusta la altura máxima */
            object-fit: cover; /* Asegura que la imagen cubra el espacio */
            border-radius: 10px;
            margin-bottom: 20px; /* Espacio entre la imagen y el carrusel */

</head>

        // Función para cargar el contenido de "Acerca de"
        function cargarAcercaDe() {
            const mainContent = document.getElementById("main-content");
            mainContent.innerHTML = `
                <div class="section mb-4 p-4 bg-white rounded shadow">
                    <h2>Acerca de la Universidad GBS A.C.</h2>
                    <p>La meta de la Universidad Gilberto Barrera Sánchez es ser la institución Educativa en la que se imparten además del Bachillerato General, Carreras Universitarias a Nivel Licenciatura, y Posgrados, todas debidamente avaladas y reconocidas por la Secretaria de Educación Guerrero, así como por la Dirección General de Profesiones.</p>
                    <p>Contar con la más selecta plantilla de catedráticos, garantizando la excelencia académica que postula como premisa de su quehacer educativo. Nuestra oferta educativa busca diversidad de actividades en los rubros más necesarios en el mercado laboral y con mayor proyección a futuro.</p>
                    <h4>Misión</h4>
                    <p>La misión de la Universidad Gilberto Barrera Sánchez consiste en garantizar la formación de profesionales y especialistas con el más alto nivel académico capaces para dar respuestas a los principales problemas de la sociedad, y que participen activamente en los cambios y económicos globales, a fin de alcanzar su progreso mediante la verdad, la justicia y la libertad. Fomentar la ciencia estimulando las investigaciones, la cultura, el arte, el deporte, el espíritu emprendedor, los valores humanos y universales como la solidaridad, ética profesional, justicia social y su formación integral.</p>
                    <h4>Visión</h4>
                    <p>La Universidad Lic. Gilberto Barrera Sánchez A.C. tiene la visión de ser la Universidad líder de la Región de la Montaña Baja, de alcance Estatal y con Proyección Nacional, proporcionando una Educación Media Superior, Superior y de Posgrado con valor duradero y sostenible, reconociendo al ser humano como un todo, inseparable de cuerpo, mente y espíritu.</p>
                    <h4>Código de Valores</h4>
                    <ol>
                        <li><strong>Ética Profesional:</strong> Para los catedráticos, alumnos y los egresados de la Universidad asuman una actitud positiva hacia el trabajo, un comportamiento responsable y moral durante el desempeño de su actividad profesional.</li>
                        <li><strong>Lealtad:</strong> Con la Universidad de todos los que la integramos, ser fieles al compromiso de defender lo que creemos y actuar de manera congruente con la palabra dada.</li>
                        <li><strong>Verdad:</strong> Para promover la búsqueda continua de lo cierto como fundamento de las ciencias y de las relaciones entre los individuos.</li>
                        <li><strong>Probidad:</strong> Para fomentar la práctica de la rectitud, la integridad y la honradez en el pensar, decir y actuar.</li>
                        <li><strong>Justicia:</strong> Para dar a cada uno lo que le corresponde, así como mejorar la distribución e igualdad de oportunidades para una vida digna.</li>
                        <li><strong>Generosidad:</strong> Para ofrecer a otros lo más preciado de sí mismo, buscando el bien de los demás, sin esperar nada a cambio.</li>
                        <li><strong>Gratitud:</strong> Para estimar y reconocer el beneficio o favor que se nos ha hecho o ha querido hacer y corresponder a ese acto de generosidad de manera positiva.</li>
                        <li><strong>Honestidad Intelectual:</strong> Para promover el respeto a la producción cultural, artística, científica y tecnológica de los miembros de la comunidad.</li>
                        <li><strong>Rigor Académico:</strong> Para que los universitarios asuman un compromiso con la precisión, la objetividad y la seriedad en el desarrollo de las tareas que conducen a la búsqueda permanente de lo verdadero.</li>
                        <li><strong>Amor al Trabajo:</strong> Para que los integrantes de la comunidad universitaria asuman un mayor compromiso con la institución, las funciones y tareas que realiza, los servicios que ofrece, la disciplina y la responsabilidad.</li>
                        <li><strong>Responsabilidad Social:</strong> Para que la Universidad cumpla responsablemente con la formación profesional de los estudiantes y su participación en el estudio y solución de los problemas de la comunidad, así como en la gestión del conocimiento, en cuanto a la investigación, producción, difusión del saber.</li>
                    </ol>
                </div>
            `;
        }

        // Función para resaltar el enlace activo
        function resaltarEnlaceActivo(id) {
            // Remover la clase "active" de todos los enlaces
            document.querySelectorAll(".navbar-nav .nav-link").forEach(enlace => {
                enlace.classList.remove("active");
            });
            // Agregar la clase "active" al enlace seleccionado
            document.getElementById(id).classList.add("active");
        }

        // Event listeners para los enlaces de navegación
        document.getElementById("inicio-link").addEventListener("click", function(event) {
            event.preventDefault(); // Evita que el enlace recargue la página
            cargarInicio();
            resaltarEnlaceActivo("inicio-link"); // Resaltar el enlace de Inicio
        });

        document.getElementById("acerca-link").addEventListener("click", function(event) {
            event.preventDefault();
            cargarAcercaDe();
            resaltarEnlaceActivo("acerca-link"); // Resaltar el enlace de Acerca de
        });

        document.getElementById("eventos-link").addEventListener("click", function(event) {
            event.preventDefault();
            cargarEventos();
            resaltarEnlaceActivo("eventos-link"); // Resaltar el enlace de Eventos
        });

        document.getElementById("oferta-link").addEventListener("click", function(event) {
            event.preventDefault();
            cargarOfertaAcademica();
            resaltarEnlaceActivo("oferta-link"); // Resaltar el enlace de Oferta Académica
        });

        // Cargar el contenido de "Inicio" por defecto al abrir la página
        cargarInicio();
    </script>
